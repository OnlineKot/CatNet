<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatNet - Kocie Centrum Dowodzenia</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #bb86fc;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            background: linear-gradient(180deg, #2c2c2c 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--accent);
        }

        h1 { margin: 0; color: var(--accent); font-size: 2.5rem; }

        .container {
            max-width: 1000px;
            width: 90%;
            padding: 20px;
        }

        /* Sekcja Kotów */
        .cat-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .cat-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s;
        }

        .cat-card:hover { transform: scale(1.02); }

        .cat-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* Panel Instagram */
        .upload-panel {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            margin-top: 40px;
            border: 2px dashed var(--accent);
        }

        .upload-panel h2 { color: var(--accent); margin-top: 0; }

        .input-group { margin-bottom: 15px; }

        input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        button:hover { opacity: 0.9; }

        footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .counter-box { margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>🐾 CatNet</h1>
    <p>Twoje okno na świat mruczków</p>
</header>

<div class="container">
    
    <!-- Sekcja z losowymi kotami -->
    <section>
        <h2>Galeria Mruczków</h2>
        <div class="cat-gallery">
            <div class="cat-card">
                <img src="https://cataas.com/cat?1" alt="Losowy kot">
            </div>
            <div class="cat-card">
                <img src="https://cataas.com/cat?2" alt="Losowy kot">
            </div>
            <div class="cat-card">
                <img src="https://cataas.com/cat?3" alt="Losowy kot">
            </div>
        </div>
    </section>

    <!-- Panel Instagram -->
    <section class="upload-panel">
        <h2>Panel Instagram (Upload Preview)</h2>
        <div class="input-group">
            <label>Wybierz zdjęcie kota:</label><br><br>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="input-group">
            <textarea id="caption" rows="4" placeholder="Napisz coś o tym kocie... #cat #meow"></textarea>
        </div>
        <button onclick="handleUpload()">Przygotuj do wysłania</button>
        <p id="status" style="display:none; margin-top: 15px; color: #4caf50;"></p>
    </section>

</div>

<footer>
    <p>&copy; 2026 CatNet. Wszystkie kocie prawa zastrzeżone.</p>
    <div class="counter-box">
        <!-- Licznik odwiedzin -->
        <script type="text/javascript" src="https://darmowe-liczniki.pl/usluga.licznik.28983"></script>
    </div>
</footer>

<script>
    function handleUpload() {
        const file = document.getElementById('imageInput').files[0];
        const status = document.getElementById('status');
        
        if (!file) {
            alert("Najpierw wybierz zdjęcie mruczka!");
            return;
        }

        // Symulacja akcji uploadu
        status.style.display = "block";
        status.innerText = "Zdjęcie gotowe! (To jest symulacja front-endu - w realnym systemie tutaj nastąpiłoby połączenie z API Instagrama Graph).";
        
        console.log("Plik do wysłania:", file.name);
        console.log("Opis:", document.getElementById('caption').value);
    }
</script>

</body>
</html>
