<style>
/* --- STYL MINIMALISTYCZNY --- */
:root {
    --bg-color: #ffffff;
    --text-color: #111111;
    --card-bg: #f9f9f9;
    --border-color: #e0e0e0;
    --accent-color: #000000;
    --accent-text: #ffffff;
}

/* Tryb VIP (Dark & Gold) */
body.premium-mode {
    --bg-color: #0a0a0a;
    --text-color: #eaeaea;
    --card-bg: #141414;
    --border-color: #333333;
    --accent-color: #d4af37; /* Złoty */
    --accent-text: #000000;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 60px 20px;
    transition: background-color 0.8s ease, color 0.8s ease;
}

.header {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -3px;
    margin-bottom: 40px;
    cursor: default;
    user-select: none;
}

/* Kontrolki */
.toolbar {
    display: flex;
    gap: 15px;
    margin-bottom: 40px;
    width: 100%;
    max-width: 1000px;
    justify-content: space-between;
    align-items: center;
}

.btn {
    background-color: transparent;
    color: var(--text-color);
    border: 1px solid var(--border-color);
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn:hover {
    border-color: var(--text-color);
}

.btn-primary {
    background-color: var(--accent-color);
    color: var(--accent-text);
    border-color: var(--accent-color);
}

.btn-primary:hover {
    opacity: 0.8;
    border-color: var(--accent-color);
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Siatka */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 1000px;
    transition: all 0.3s ease;
}

.grid.column-layout {
    grid-template-columns: 1fr;
    max-width: 600px;
}

.card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 4/5;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.08);
}

body.premium-mode .card:hover {
    box-shadow: 0 12px 24px rgba(212, 175, 55, 0.15);
}

/* Sekcja VIP */
.vip-section {
    margin-top: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.vip-timer {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--text-color);
}

/* Licznik */
.stats {
    margin-top: auto;
    padding-top: 60px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #888;
    text-transform: uppercase;
}

/* Ukryte Menu (T) */
#admin-panel {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #000;
    color: #0f0;
    border: 1px solid #333;
    padding: 30px;
    border-radius: 12px;
    z-index: 9999;
    font-family: monospace;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

#admin-panel input {
    background: #111;
    color: #0f0;
    border: 1px solid #333;
    padding: 8px;
    width: 60px;
    text-align: center;
    margin: 10px 0;
}

#admin-panel button {
    background: #222;
    color: #fff;
    border: none;
    padding: 8px 16px;
    margin: 5px;
    cursor: pointer;
    border-radius: 4px;
}
#admin-panel button:hover { background: #444; }
.premium-badge { display: none; font-size: 14px; font-weight: bold; letter-spacing: 4px; color: var(--accent-color); margin-bottom: 20px;}
body.premium-mode .premium-badge { display: block; }
</style>
</head>
<body>

<div class="header">CATNE<span onclick="triggerAdmin()" style="cursor:default">T</span></div>
<div class="premium-badge">STATUS VIP AKTYWNY</div>

<div class="toolbar">
    <button class="btn" onclick="toggleLayout()">UKŁAD</button>
    <button class="btn btn-primary" onclick="loadCats()">NASTĘPNE</button>
</div>

<div class="grid" id="cat-grid"></div>

<div class="vip-section" id="vip-container">
    <button class="btn" id="vip-btn" onclick="requestVip()">OFERTA VIP</button>
    <div class="vip-timer" id="vip-timer" style="display: none;"></div>
</div>

<div class="stats">AKTYWNE SESJE: <span id="counter">...</span></div>

<div id="admin-panel">
    <h3>ROOT_ACCESS</h3>
    LIMIT: <input type="number" id="adm-limit" value="5"><br>
    <button onclick="applyAdminSettings()">ZAPISZ</button>
    <button onclick="forceVip()" style="color:#d4af37;">FORCE VIP</button>
    <button onclick="closeAdmin()">ZAMKNIJ</button>
</div>

<script>
const API_KEY = "Live_p2Iw0CPRFAh8EIYZqvt3CMJMOqQQFjRdUND82x6c0kHVB5proE1aCebeSRcvJvrT";
const grid = document.getElementById('cat-grid');
let currentLimit = 5;
let countdownInterval;

// 1. Ładowanie kotów
async function loadCats() {
    grid.innerHTML = '';
    try {
        const response = await fetch(`https://api.thecatapi.com/v1/images/search?limit=${currentLimit}`, {
            headers: { 'x-api-key': API_KEY }
        });
        const data = await response.json();
        data.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'card';
            const img = document.createElement('img');
            img.src = cat.url;
            img.loading = "lazy";
            card.appendChild(img);
            grid.appendChild(card);
        });
    } catch (error) {
        console.error("Błąd połączenia z API.");
    }
}

// 2. Licznik sesji
async function loadCounter() {
    try {
        const res = await fetch('https://api.counterapi.dev/v1/onlinekot-github-io/catnet/up');
        const data = await res.json();
        document.getElementById('counter').innerText = data.count;
    } catch(e) {}
}

// 3. Zmiana układu
function toggleLayout() {
    grid.classList.toggle('column-layout');
}

// 4. Logika VIP
function requestVip() {
    let unlockTime = localStorage.getItem('vip_unlock_timestamp');
    let now = new Date().getTime();

    if (!unlockTime) {
        // Obliczamy czas do najbliższej północy
        let tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(0, 0, 0, 0);
        
        localStorage.setItem('vip_unlock_timestamp', tomorrow.getTime());
        startVipTimer(tomorrow.getTime());
    } else {
        if (now >= parseInt(unlockTime)) {
            let key = prompt("WPROWADŹ KLUCZ DOSTĘPU:");
            if (key) {
                sessionStorage.setItem('vip_active', 'true');
                activateVipMode();
            }
        }
    }
}

function checkVipStatus() {
    let unlockTime = localStorage.getItem('vip_unlock_timestamp');
    if (unlockTime) {
        let now = new Date().getTime();
        if (now < parseInt(unlockTime)) {
            startVipTimer(parseInt(unlockTime));
        } else {
            const btn = document.getElementById('vip-btn');
            btn.innerText = "AUTORYZUJ VIP";
            btn.classList.add('btn-primary');
        }
    }
}

function startVipTimer(targetTime) {
    const btn = document.getElementById('vip-btn');
    const timerDisplay = document.getElementById('vip-timer');
    
    btn.disabled = true;
    btn.innerText = "WERYFIKACJA W TOKU";
    timerDisplay.style.display = 'block';

    clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
        let now = new Date().getTime();
        let diff = targetTime - now;

        if (diff <= 0) {
            clearInterval(countdownInterval);
            btn.disabled = false;
            btn.innerText = "AUTORYZUJ VIP";
            btn.classList.add('btn-primary');
            timerDisplay.style.display = 'none';
        } else {
            let h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            let s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
            timerDisplay.innerText = `${h}:${m}:${s}`;
        }
    }, 1000);
}

function activateVipMode() {
    document.body.classList.add('premium-mode');
    document.getElementById('vip-container').style.display = 'none';
    currentLimit = 3; // Mniej, ale bardziej ekskluzywnie
    loadCats();
}

// 5. Ukryty panel Admina
let clickCount = 0;
function triggerAdmin() {
    clickCount++;
    if (clickCount === 17) {
        document.getElementById('admin-panel').style.display = 'block';
        clickCount = 0;
    }
}
function applyAdminSettings() {
    currentLimit = document.getElementById('adm-limit').value;
    loadCats();
    closeAdmin();
}
function forceVip() {
    sessionStorage.setItem('vip_active', 'true');
    activateVipMode();
    closeAdmin();
}
function closeAdmin() {
    document.getElementById('admin-panel').style.display = 'none';
}

// Start aplikacji
window.onload = () => {
    loadCounter();
    if (sessionStorage.getItem('vip_active') === 'true') {
        activateVipMode();
    } else {
        loadCats();
        checkVipStatus();
    }
};
</script>
</body>
</html>
