<style>
body {
    background: #050505;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 0;
}

.header {
    font-size: 85px;
    font-weight: 900;
    letter-spacing: -5px;
    text-transform: uppercase;
    margin-bottom: 30px;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
}

#grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    width: 90%;
    max-width: 1100px;
    margin-bottom: 40px;
}

.cat-card {
    flex: 1 1 calc(33.333% - 20px);
    min-width: 280px;
    height: 350px;
    object-fit: cover;
    border-radius: 15px;
    border: 2px solid #1a1a1a;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
}

/* Świecące przyciski RGB */
.rgb-btn {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
    background-size: 400% 400%;
    animation: flow 8s linear infinite;
    color: #fff;
    border: none;
    padding: 18px 45px;
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    margin: 10px;
    transition: transform 0.2s;
}

@keyframes flow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.rgb-btn:active { transform: scale(0.95); }

/* Kontener VIP z powiadomieniem */
.vip-wrap {
    position: relative;
    display: inline-block;
    margin-top: 20px;
}

.badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff0000;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 900;
    box-shadow: 0 0 15px #ff0000;
    border: 2px solid #000;
    animation: pulse 1.5s infinite alternate;
    z-index: 5;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.25); }
}

/* Licznik wizyt */
.stats {
    background: #111;
    padding: 15px 30px;
    border-radius: 10px;
    border: 1px solid #222;
    font-size: 14px;
    font-weight: 900;
    color: #555;
    margin-top: 50px;
    letter-spacing: 2px;
}

.stats span { color: #0f0; text-shadow: 0 0 5px #0f0; }

/* Ukryte Menu T */
#adm {
    display: none;
    background: #000;
    border: 1px solid #0f0;
    padding: 20px;
    margin-bottom: 20px;
    color: #0f0;
    font-family: monospace;
}

/* Luksusowy efekt VIP */
body.vip-mode {
    animation: rgbBorder 10s linear infinite;
}

@keyframes rgbBorder {
    0% { box-shadow: inset 0 0 40px rgba(255,0,0,0.5); }
    33% { box-shadow: inset 0 0 40px rgba(0,255,0,0.5); }
    66% { box-shadow: inset 0 0 40px rgba(0,0,255,0.5); }
    100% { box-shadow: inset 0 0 40px rgba(255,0,0,0.5); }
}
</style>
</head>
<body>

<div class="header">CATNE<span onclick="q()" style="cursor:default">T</span></div>

<div id="adm">
    [ ROOT ] <input type="number" id="lmt" value="5" style="width:50px"> 
    <button onclick="u()">SET</button> | 
    <button onclick="fV()">FORCE VIP</button>
</div>

<div id="grid"></div>

<button class="rgb-btn" onclick="next()">NEXT</button>

<div class="vip-wrap">
    <div class="badge">1</div>
    <button class="rgb-btn" style="padding: 25px 60px;" onclick="req()">OFERTA VIP</button>
</div>

<div class="stats">AKTYWNE POŁĄCZENIA Z SIECIĄ: <span id="counter">...</span></div>

<script>
const key = "Live_p2Iw0CPRFAh8EIYZqvt3CMJMOqQQFjRdUND82x6c0kHVB5proE1aCebeSRcvJvrT";
const g = document.getElementById('grid');
let lim = 5;

async function load(n) {
    try {
        const r = await fetch(`https://api.thecatapi.com/v1/images/search?limit=${n}`, {
            headers: {'x-api-key': key}
        });
        const d = await r.json();
        d.forEach(c => {
            const i = document.createElement('img');
            i.src = c.url;
            i.className = 'cat-card';
            g.appendChild(i);
        });
    } catch(e) {}
}

async function cnt() {
    try {
        const r = await fetch('https://api.counterapi.dev/v1/onlinekot-github-io/catnet/up');
        const d = await r.json();
        document.getElementById('counter').innerText = d.count;
    } catch(e) {}
}

function next() { g.innerHTML = ''; load(lim); }

function req() {
    let now = new Date();
    let tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(0,0,0,0);

    let s = localStorage.getItem('v_date');
    if (!s) {
        localStorage.setItem('v_date', tomorrow.toISOString());
        alert("WERYFIKACJA ROZPOCZĘTA. WRÓĆ JUTRO.");
    } else {
        if (now >= new Date(s)) {
            if(prompt("PODAJ KLUCZ:") !== null) {
                sessionStorage.setItem('va', '1');
                goVip();
            }
        } else {
            alert("DOSTĘP ZABLOKOWANY. PROCES W TOKU.");
        }
    }
}

function goVip() {
    document.body.classList.add('vip-mode');
    document.querySelector('.vip-wrap').style.display = 'none';
    g.innerHTML = '';
    load(3);
}

let tc = 0;
function q() { if(++tc === 17) { document.getElementById('adm').style.display='block'; tc=0; } }
function u() { lim = document.getElementById('lmt').value; next(); }
function fV() { sessionStorage.setItem('va','1'); goVip(); document.getElementById('adm').style.display='none'; }

window.onload = () => {
    cnt();
    if(sessionStorage.getItem('va') === '1') goVip(); else load(lim);
};
</script>
</body>
</html>
