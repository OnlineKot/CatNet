<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CatID, wykrywanie znaku wodnego CatNet</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:26px 20px 40px;background:#0a0a0c;color:#ededf0;text-align:center;
       font:500 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:23px;letter-spacing:-.02em}
  .brand img{width:30px;height:30px;border-radius:8px}
  .brand .id{color:#ffc22e}
  p.sub{color:#8a8a92;font-size:13.5px;margin:8px 0 22px}
  .drop{max-width:620px;margin:0 auto;padding:26px;border-radius:18px;cursor:pointer;
        border:1.5px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
  .drop.on{border-color:#ffc22e;background:rgba(255,194,46,.08)}
  .verdict{max-width:620px;margin:18px auto 0;padding:15px 18px;border-radius:14px;font-weight:700;display:none}
  .yes{background:rgba(45,212,120,.13);border:1px solid rgba(45,212,120,.4);color:#5ef0a0}
  .no{background:rgba(255,86,110,.10);border:1px solid rgba(255,86,110,.35);color:#ff8b9c}
  .verdict small{display:block;font-weight:500;color:#a8a8b0;margin-top:5px;font-size:12.5px}
  canvas{max-width:100%;border-radius:12px;margin-top:16px;background:#111;
         box-shadow:0 14px 40px rgba(0,0,0,.5);image-rendering:auto}
  .hint{color:#7a7a83;font-size:12px;margin-top:12px;max-width:620px;margin-inline:auto}
  .busy{color:#ffc22e;font-weight:700;margin-top:14px;display:none}
</style>
</head>
<body>
  <div class="brand"><img src="/catnet-icon.png" alt=""><span>Cat<span class="id">ID</span></span></div>
  <p class="sub">Sprawdź, czy zdjęcie pochodzi z CatNet. Działa też na <b>wycinku</b> zdjęcia.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" hidden>
    Kliknij lub upuść zdjęcie
  </label>

  <div class="busy" id="busy">Analizuję…</div>
  <div class="verdict" id="verdict"></div>
  <canvas id="out"></canvas>
  <p class="hint">CatID składa powtarzalny wzór z całego kadru i uśrednia go, dzięki czemu ukryty podpis
     wychodzi nawet wtedy, gdy gołym okiem nie widać go wcale.</p>

<script>
(function () {
  var PX = 312, PY = 52, ROT = 30 * Math.PI / 180;
  var CW = 156, CH = 26;
  var SCALES = [0.92, 1, 1.09];
  var refVec = null;

  var drop=document.getElementById("drop"), file=document.getElementById("file"),
      out=document.getElementById("out"), verdict=document.getElementById("verdict"),
      busy=document.getElementById("busy");

  var refImg=new Image();
  refImg.onload=function(){ refVec=buildRef(refImg); };
  refImg.src="/catid-ref.png";

  drop.addEventListener("click",function(){file.click();});
  ["dragenter","dragover"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add("on");});});
  ["dragleave","drop"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove("on");});});
  drop.addEventListener("drop",function(ev){ if(ev.dataTransfer.files[0]) read(ev.dataTransfer.files[0]); });
  file.addEventListener("change",function(){ if(file.files[0]) read(file.files[0]); });

  function read(f){
    var fr=new FileReader();
    fr.onload=function(){ var i=new Image();
      i.onload=function(){ busy.style.display="block";
        setTimeout(function(){ try{ run(i);}catch(e){} busy.style.display="none"; },30); };
      i.src=fr.result; };
    fr.readAsDataURL(f);
  }

  // rozmycie pudelkowe, rozdzielne, w zmiennoprzecinkowym (bez obcinania)
  function boxBlur(src,W,H,r){
    var tmp=new Float64Array(W*H), out2=new Float64Array(W*H), k=2*r+1, x,y,i,sum;
    for(y=0;y<H;y++){
      var o=y*W; sum=0;
      for(i=-r;i<=r;i++) sum+=src[o+Math.min(W-1,Math.max(0,i))];
      for(x=0;x<W;x++){
        tmp[o+x]=sum/k;
        sum-=src[o+Math.min(W-1,Math.max(0,x-r))];
        sum+=src[o+Math.min(W-1,Math.max(0,x+r+1))];
      }
    }
    for(x=0;x<W;x++){
      sum=0;
      for(i=-r;i<=r;i++) sum+=tmp[Math.min(H-1,Math.max(0,i))*W+x];
      for(y=0;y<H;y++){
        out2[y*W+x]=sum/k;
        sum-=tmp[Math.min(H-1,Math.max(0,y-r))*W+x];
        sum+=tmp[Math.min(H-1,Math.max(0,y+r+1))*W+x];
      }
    }
    return out2;
  }
  function bandpass(g,W,H){
    var a=boxBlur(g,W,H,1), b=boxBlur(g,W,H,4), o=new Float64Array(W*H);
    for(var i=0;i<o.length;i++) o[i]=a[i]-b[i];
    return o;
  }
  function grayOf(cv,W,H){
    var d=cv.getContext("2d",{willReadFrequently:true}).getImageData(0,0,W,H).data;
    var g=new Float64Array(W*H);
    for(var i=0,j=0;i<d.length;i+=4,j++) g[j]=(d[i]+d[i+1]+d[i+2])/3;
    return g;
  }
  function buildRef(img){
    var c=document.createElement("canvas"); c.width=PX; c.height=PY;
    c.getContext("2d").drawImage(img,0,0,PX,PY);
    var bp=bandpass(grayOf(c,PX,PY),PX,PY);
    var v=resample(bp,PX,PY,CW,CH); norm(v); return v;
  }
  function derotate(img,W,H){
    var D=Math.ceil(Math.abs(W*Math.cos(ROT))+Math.abs(H*Math.sin(ROT)));
    var E=Math.ceil(Math.abs(W*Math.sin(ROT))+Math.abs(H*Math.cos(ROT)));
    var c=document.createElement("canvas"); c.width=D; c.height=E;
    var x=c.getContext("2d",{willReadFrequently:true});
    x.fillStyle="#808080"; x.fillRect(0,0,D,E);
    x.translate(D/2,E/2); x.rotate(-ROT); x.drawImage(img,-W/2,-H/2,W,H);
    return c;
  }
  function fold(bp,W,H,px,py){
    var acc=new Float64Array(px*py), ny=(H/py)|0, nx=(W/px)|0;
    if(ny<1||nx<1) return null;
    for(var by=0;by<ny;by++)for(var y=0;y<py;y++){
      var sy=(by*py+y)*W, ty=y*px;
      for(var bx=0;bx<nx;bx++){
        var sx=bx*px;
        for(var x=0;x<px;x++) acc[ty+x]+=bp[sy+sx+x];
      }
    }
    var n=ny*nx;
    for(var i=0;i<acc.length;i++) acc[i]/=n;
    return {tile:acc,reps:n};
  }
  function resample(src,sw,sh,dw,dh){
    var o=new Float64Array(dw*dh);
    for(var y=0;y<dh;y++)for(var x=0;x<dw;x++) o[y*dw+x]=src[((y*sh/dh)|0)*sw+((x*sw/dw)|0)];
    return o;
  }
  function norm(v){
    var n=v.length,m=0,i;
    for(i=0;i<n;i++) m+=v[i]; m/=n;
    var s=0; for(i=0;i<n;i++){ v[i]-=m; s+=v[i]*v[i]; }
    s=Math.sqrt(s/n)||1; for(i=0;i<n;i++) v[i]/=s;
  }
  function maxCorr(a,b){
    var best=-1,sx,sy,x,y,sum,ay,by;
    for(sy=0;sy<CH;sy++)for(sx=0;sx<CW;sx++){
      sum=0;
      for(y=0;y<CH;y++){
        ay=y*CW; by=((y+sy)%CH)*CW;
        for(x=0;x<CW;x++) sum+=a[ay+x]*b[by+((x+sx)%CW)];
      }
      sum/=(CW*CH); if(sum>best) best=sum;
    }
    return best;
  }

  function run(img){
    var W=Math.min(img.naturalWidth,1500);
    var H=Math.round(img.naturalHeight*W/img.naturalWidth);
    var rc=derotate(img,W,H), RW=rc.width, RH=rc.height;
    var g=grayOf(rc,RW,RH);
    // odetnij ramke po obrocie (rogi bez obrazu)
    var m=Math.round(Math.min(RW,RH)*0.16);
    var CWi=RW-2*m, CHi=RH-2*m, gc=new Float64Array(CWi*CHi);
    for(var y=0;y<CHi;y++) for(var x=0;x<CWi;x++) gc[y*CWi+x]=g[(y+m)*RW+(x+m)];
    var bp=bandpass(gc,CWi,CHi);

    var best=null;
    for(var i=0;i<SCALES.length;i++){
      var px=Math.round(PX*SCALES[i]), py=Math.round(PY*SCALES[i]);
      var fo=fold(bp,CWi,CHi,px,py);
      if(!fo) continue;
      var v=resample(fo.tile,px,py,CW,CH); norm(v);
      var c=refVec?maxCorr(v,refVec):0;
      if(!best||c>best.corr) best={corr:c,vec:v,reps:fo.reps,sc:SCALES[i]};
    }
    if(!best){ verdict.style.display="block"; verdict.className="verdict no";
      verdict.innerHTML="Zdjęcie za małe<small>potrzeba co najmniej ok. 400 px</small>"; return; }

    out.width=CW*3; out.height=CH*3*2;
    var ctx=out.getContext("2d"), im=ctx.createImageData(out.width,out.height), mx=0;
    for(var j=0;j<best.vec.length;j++) mx=Math.max(mx,Math.abs(best.vec[j]));
    var gg=mx>0?110/mx:1;
    for(y=0;y<out.height;y++)for(x=0;x<out.width;x++){
      var vv=128+best.vec[(((y/3|0)%CH)*CW)+((x/3|0)%CW)]*gg;
      var k=(y*out.width+x)<<2;
      im.data[k]=im.data[k+1]=im.data[k+2]=vv<0?0:vv>255?255:vv; im.data[k+3]=255;
    }
    ctx.putImageData(im,0,0);

    var hit=best.corr>0.135 && best.reps>=6;
    verdict.style.display="block";
    verdict.className="verdict "+(hit?"yes":"no");
    verdict.innerHTML=(hit?"Wykryto CatID":"Nie wykryto CatID")
      +"<small>dopasowanie "+(best.corr*100).toFixed(0)+"% · powtórzeń wzoru: "+best.reps+"</small>";
  }
})();

</script>
</body>
</html>
