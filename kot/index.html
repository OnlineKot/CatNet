<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Losowy kot | TeodorTeo.com</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:18px;background:#0a0a0c;color:#ededf0;
       font:500 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  #stage{display:grid;place-items:center;gap:14px;max-width:100%}
  .shot{position:relative;display:inline-flex;max-width:100%;border-radius:16px;overflow:hidden;
        box-shadow:0 18px 50px rgba(0,0,0,.55)}
  .shot img,.shot canvas{display:block;max-width:min(94vw,900px);max-height:78vh;width:auto;height:auto;
        -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
  .wm{position:absolute;right:9px;bottom:9px;display:inline-flex;align-items:center;
      padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);
      -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
      color:rgba(255,255,255,.94);font-size:11px;font-weight:700;letter-spacing:.2px;
      text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.18);
        border-top-color:#ffc22e;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button,a.btn{font:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;
       border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#ededf0;
       cursor:pointer;text-decoration:none}
  button.primary{background:#ffc22e;color:#1a1a1a;border-color:transparent}
  .credit{font-size:12px;color:#8a8a92}
  .credit a{color:#ffc22e;text-decoration:none}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <main id="stage"><div class="spin" aria-hidden="true"></div></main>

<script>
(function () {
  var API      = "https://api.thecatapi.com/v1/images/search";
  var KEY      = "";
  var FALLBACK = "https://cataas.com/cat";
  var MARK     = "powered by TeodorTeo.com";
  var TIMEOUT  = 4000;
  var stage    = document.getElementById("stage");

  function el(t, c) { var e = document.createElement(t); if (c) e.className = c; return e; }

  function shell(node) {
    stage.innerHTML = "";
    var wrap = el("div", "shot");
    wrap.appendChild(node);
    stage.appendChild(wrap);
    var bar = el("div", "bar");
    var again = el("button"); again.className = "primary"; again.textContent = "Nowy kot";
    again.onclick = function () { load(); };
    bar.appendChild(again);
    stage.appendChild(bar);
    var c = el("p", "credit");
    c.innerHTML = 'powered by <a href="https://teodorteo.com" target="_blank" rel="noopener">TeodorTeo.com</a>';
    stage.appendChild(c);
    return wrap;
  }

  var CID_PX = 312, CID_PY = 52, CID_ROT = 30 * Math.PI / 180, CID_A = 16, CID_REF = 1500;
  var cidTile = null, cidTried = false;

  function cidPrepare() {
    if (cidTried) return;
    cidTried = true;
    var ref = new Image();
    ref.crossOrigin = "anonymous";
    ref.onload = function () {
      try {
        var t = el("canvas"); t.width = CID_PX; t.height = CID_PY;
        var tx = t.getContext("2d", { willReadFrequently: true });
        tx.drawImage(ref, 0, 0, CID_PX, CID_PY);
        var im = tx.getImageData(0, 0, CID_PX, CID_PY), d = im.data, i, v;
        var n = d.length / 4, mid = 0, peak = 1;
        for (i = 0; i < d.length; i += 4) mid += (d[i] + d[i + 1] + d[i + 2]) / 3;
        mid /= n;
        for (i = 0; i < d.length; i += 4) {
          v = Math.abs((d[i] + d[i + 1] + d[i + 2]) / 3 - mid);
          if (v > peak) peak = v;
        }
        for (i = 0; i < d.length; i += 4) {
          v = (d[i] + d[i + 1] + d[i + 2]) / 3 - mid;
          d[i] = d[i + 1] = d[i + 2] = v >= 0 ? 255 : 0;
          d[i + 3] = Math.round(Math.min(1, Math.abs(v) / peak) * CID_A);
        }
        tx.putImageData(im, 0, 0);
        cidTile = t;
      } catch (e) { cidTile = null; }
    };
    ref.src = "/catid-ref.png";
  }

  function cidDraw(x, W, H) {
    if (!cidTile) return;
    try {
      var pat = x.createPattern(cidTile, "repeat");
      if (!pat) return;
      var s = W > CID_REF ? W / CID_REF : 1;
      var span = Math.ceil(Math.sqrt(W * W + H * H) / s) + 2 * CID_PX;
      x.save();
      x.translate(W / 2, H / 2);
      x.rotate(CID_ROT);
      x.scale(s, s);
      x.fillStyle = pat;
      x.fillRect(-span / 2, -span / 2, span, span);
      x.restore();
    } catch (e) {}
  }

    function bake(img) {
    var W = img.naturalWidth, H = img.naturalHeight;
    var c = el("canvas"); c.width = W; c.height = H;
    var x = c.getContext("2d");
    x.drawImage(img, 0, 0, W, H);
    cidDraw(x, W, H);
    var unit = Math.min(W, H);
    var fs   = Math.max(12, Math.round(unit * 0.035));
    var pad  = Math.round(unit * 0.028);
    x.font = "700 " + fs + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    var tw = x.measureText(MARK).width;
    var bw = Math.round(tw + fs * 1.4), bh = Math.round(fs * 1.9);
    var bx = W - pad - bw, by = H - pad - bh, r = bh / 2;
    x.fillStyle = "rgba(0,0,0,.45)";
    x.beginPath();
    x.moveTo(bx + r, by);
    x.arcTo(bx + bw, by, bx + bw, by + bh, r);
    x.arcTo(bx + bw, by + bh, bx, by + bh, r);
    x.arcTo(bx, by + bh, bx, by, r);
    x.arcTo(bx, by, bx + bw, by, r);
    x.closePath(); x.fill();
    x.fillStyle = "rgba(255,255,255,.95)";
    x.textBaseline = "middle";
    x.shadowColor = "rgba(0,0,0,.5)"; x.shadowBlur = Math.round(fs * 0.25);
    x.fillText(MARK, bx + fs * 0.7, by + bh / 2 + Math.round(fs * 0.05));
    return c;
  }

  function show(url) {
    var img = new Image();
    img.crossOrigin = "anonymous";
    img.alt = "Losowy kot";
    img.draggable = false;
    img.onload = function () {
      var node;
      try { node = bake(img); } catch (e) { node = null; }
      if (node) { shell(node); return; }
      plain(url);
    };
    img.onerror = function () { plain(url); };
    img.src = url;
  }

  // Rezerwa: zwykły <img> + znak wodny jako nakładka
  function plain(url) {
    var img = new Image();
    img.alt = "Losowy kot"; img.draggable = false; img.src = url;
    var wrap = shell(img);
    var w = el("span", "wm"); w.textContent = MARK;
    wrap.appendChild(w);
  }

  function load() {
    stage.innerHTML = '<div class="spin" aria-hidden="true"></div>';
    var done = false;
    function go(u) { if (done) return; done = true; show(u); }
    var timer = setTimeout(function () { go(FALLBACK); }, TIMEOUT);
    try {
      fetch(API + (KEY ? "?api_key=" + encodeURIComponent(KEY) : ""), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) { clearTimeout(timer); go((d && d[0] && d[0].url) || FALLBACK); })
        .catch(function () { clearTimeout(timer); go(FALLBACK); });
    } catch (e) { clearTimeout(timer); go(FALLBACK); }
  }

  document.addEventListener("contextmenu", function (e) {
    if (e.target && (e.target.tagName === "IMG" || e.target.tagName === "CANVAS")) e.preventDefault();
  });

  cidPrepare();
  load();
})();
</script>
</body>
</html>
