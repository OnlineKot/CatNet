<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Detektor znaku wodnego — CatNet</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:26px;background:#0a0a0c;color:#ededf0;text-align:center;
       font:500 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  p.sub{color:#8a8a92;font-size:13.5px;margin:0 0 20px}
  .drop{max-width:640px;margin:0 auto 16px;padding:26px;border-radius:18px;
        border:1.5px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.04);cursor:pointer}
  .drop.on{border-color:#ffc22e;background:rgba(255,194,46,.08)}
  .row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0}
  input[type=range]{width:230px;accent-color:#ffc22e}
  canvas{max-width:100%;border-radius:14px;box-shadow:0 16px 44px rgba(0,0,0,.55);margin-top:14px}
  .hint{color:#8a8a92;font-size:12.5px;margin-top:10px}
  a{color:#ffc22e}
</style>
</head>
<body>
  <h1>Detektor znaku wodnego</h1>
  <p class="sub">Wrzuć zdjęcie z <b>CatNet</b> — filtr wydobywa ukrytą warstwę, niewidoczną gołym okiem.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" hidden>
    Kliknij lub upuść zdjęcie
  </label>

  <div class="row">
    <span>Czułość</span>
    <input type="range" id="gain" min="4" max="60" value="40">
    <span id="gv">26×</span>
  </div>

  <canvas id="out"></canvas>
  <p class="hint">Jeśli zdjęcie pochodzi z CatNet, pojawi się powtarzany napis <b>CatNet.TeodorTeo.com</b>.</p>

<script>
(function () {
  var drop = document.getElementById("drop"),
      file = document.getElementById("file"),
      gain = document.getElementById("gain"),
      gv   = document.getElementById("gv"),
      out  = document.getElementById("out"),
      img  = null;

  drop.addEventListener("click", function () { file.click(); });
  ["dragenter","dragover"].forEach(function(e){
    drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.add("on"); });
  });
  ["dragleave","drop"].forEach(function(e){
    drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.remove("on"); });
  });
  drop.addEventListener("drop", function (ev) {
    if (ev.dataTransfer.files[0]) read(ev.dataTransfer.files[0]);
  });
  file.addEventListener("change", function () { if (file.files[0]) read(file.files[0]); });
  gain.addEventListener("input", function () { gv.textContent = gain.value + "×"; render(); });

  function read(f) {
    var fr = new FileReader();
    fr.onload = function () {
      img = new Image();
      img.onload = render;
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  }

  // Filtr gornoprzepustowy: obraz minus jego rozmycie, wzmocnione.
  // Ujawnia drobna strukture (nasz ukryty napis), tlumiac tresc zdjecia.
  function render() {
    if (!img) return;
    var W = Math.min(img.naturalWidth, 1400);
    var H = Math.round(img.naturalHeight * W / img.naturalWidth);
    out.width = W; out.height = H;

    // Pasmowoprzepustowy: lekkie rozmycie tnie drobny szum (trawa, futro),
    // mocniejsze usuwa tresc zdjecia. Roznica zostawia skale naszego napisu.
    var a = document.createElement("canvas"); a.width = W; a.height = H;
    var actx = a.getContext("2d", { willReadFrequently: true });
    actx.filter = "blur(1.6px)";
    actx.drawImage(img, 0, 0, W, H);
    var sharp = actx.getImageData(0, 0, W, H);

    var b = document.createElement("canvas"); b.width = W; b.height = H;
    var bctx = b.getContext("2d", { willReadFrequently: true });
    bctx.filter = "blur(7px)";
    bctx.drawImage(img, 0, 0, W, H);
    var soft = bctx.getImageData(0, 0, W, H);

    var g = Number(gain.value) || 20;
    var s = sharp.data, f2 = soft.data;
    for (var i = 0; i < s.length; i += 4) {
      var d = ((s[i] - f2[i]) + (s[i+1] - f2[i+1]) + (s[i+2] - f2[i+2])) / 3;
      var v = 128 + d * g;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      s[i] = s[i+1] = s[i+2] = v;
    }
    out.getContext("2d").putImageData(sharp, 0, 0);
  }
})();
</script>
</body>
</html>
